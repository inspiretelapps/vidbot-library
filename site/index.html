  <header class="topbar"><div class="shell nav-shell"><a class="brand" href="#library" aria-label="YouSummary video library"><span class="logo-play" aria-hidden="true"></span><span class="brand-word">YouSummary</span></a><div class="nav-copy"><span class="nav-dot"></span><span class="nav-kicker">Video intelligence library</span></div><div class="nav-actions"><button id="refreshButton" class="icon-toggle refresh-toggle" type="button" aria-label="Run playlist scan now" title="Check playlist for new videos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M6.1 9a7 7 0 0 1 11.6-2.6L20 9M4 15l2.3 2.6A7 7 0 0 0 17.9 15"/></svg></button><button id="themeToggle" class="icon-toggle theme-toggle" type="button" aria-label="Switch colour theme"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 15.2A8.4 8.4 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg></button></div></div></header>

  <script>
    const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const linkifyDescription=s=>{const text=String(s??''),pattern=/https?:\/\/[^\s<>"']+/g;let html='',last=0;for(const match of text.matchAll(pattern)){html+=esc(text.slice(last,match.index));let url=match[0],trail='';while(/[),.;!?]$/.test(url)){trail=url.slice(-1)+trail;url=url.slice(0,-1)}html+=`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>${esc(trail)}`;last=match.index+match[0].length}return(html+esc(text.slice(last))).replace(/\n/g,'<br>')};
    const fmtDuration=s=>{s=Number(s)||0;const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
    const fmtDate=v=>{if(!v)return'Unknown';const d=/^\d{4}-\d{2}-\d{2}$/.test(v)?new Date(v+'T12:00:00'):new Date(v);return new Intl.DateTimeFormat('en-ZA',{day:'numeric',month:'short',year:'numeric'}).format(d)};
    const chapterUrl=(url,seconds)=>{try{const u=new URL(url);u.searchParams.set('t',`${Number(seconds)||0}s`);return u.toString()}catch(e){return `${url}${url.includes('?')?'&':'?'}t=${Number(seconds)||0}s`}};
    const setTheme=theme=>{document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#18191f':'#f6f6f6';try{localStorage.setItem('vidbot-theme',theme)}catch(e){};$('#themeToggle').setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode')};
    $('#themeToggle').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));setTheme(document.documentElement.dataset.theme||'light');
    const REFRESH_URL='https://m1.tail4fdcd0.ts.net/refresh/bf7abd0a6c618ad43854c54de8dd4a7700b51796edbd65e5';let refreshTimer;
    const showRefreshStatus=(message,error=false)=>{const status=$('#refreshStatus');status.textContent=message;status.classList.toggle('error',error);status.classList.add('show');clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>status.classList.remove('show'),7000)};
    $('#refreshButton').addEventListener('click',async()=>{const button=$('#refreshButton');button.disabled=true;button.classList.add('is-loading');showRefreshStatus('Checking the playlist for new videos…');try{const response=await fetch(REFRESH_URL,{method:'POST',headers:{'Content-Type':'application/json'}});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.message||`Refresh failed (HTTP ${response.status})`);showRefreshStatus(result.message||'Playlist refresh started. New summaries will be sent to WhatsApp.')}catch(error){showRefreshStatus(error.message||'Could not start the playlist refresh.',true)}finally{button.disabled=false;button.classList.remove('is-loading')}});
    const ARCHIVE_KEY='yousummary-archived';let DATA=null,activeView='active',archived=new Set();
    try{archived=new Set(JSON.parse(localStorage.getItem(ARCHIVE_KEY)||'[]'))}catch(e){archived=new Set()}
    const saveArchive=()=>{try{localStorage.setItem(ARCHIVE_KEY,JSON.stringify([...archived]))}catch(e){}};
    function render(){const q=$('#search').value.trim().toLowerCase(),filter=$('#chapterFilter').value;const activeTotal=DATA.videos.filter(v=>!archived.has(v.id)).length,archiveTotal=DATA.videos.length-activeTotal;$('#activeCount').textContent=activeTotal;$('#archiveCount').textContent=archiveTotal;const videos=DATA.videos.filter(v=>{const hay=JSON.stringify([v.title,v.channel,v.description,v.summary,v.why_valuable,v.key_takeaways,v.chapters]).toLowerCase(),inView=activeView==='archive'?archived.has(v.id):!archived.has(v.id);return inView&&(!q||hay.includes(q))&&(filter==='all'||v.chapters.some(c=>c.source===filter))});
      $('#cards').innerHTML=videos.length?videos.map((v,i)=>`<article class="video-card"><div class="video-header"><a class="thumb-wrap" href="${esc(v.url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(v.thumbnail)}" alt="${esc(v.title)} thumbnail" loading="lazy" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg'"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="duration">${fmtDuration(v.duration_seconds)}</span></a><div class="video-intro"><div class="video-meta"><span>${esc(v.channel||'YouTube')}</span><span class="dot">Published ${fmtDate(v.upload_date)}</span><span class="dot">Detected ${fmtDate(v.first_detected_at)}</span></div><h2>${esc(v.title)}</h2><div class="value-label">Why this is valuable</div><p class="value-text">${esc(v.why_valuable)}</p><label class="archive-check"><input class="archive-toggle" type="checkbox" data-video-id="${esc(v.id)}" ${archived.has(v.id)?'checked':''}><span>${archived.has(v.id)?'Archived — move back to To read':'Archive after reading'}</span></label></div></div><div class="summary-panel"><h3>Executive summary</h3><div class="summary-copy">${String(v.summary||'').split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</div><ul class="takeaways">${(v.key_takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><details class="description-details"><summary><span class="summary-title">Full video description</span><span class="chapter-count">Links included</span></summary><div class="description-body">${linkifyDescription(v.description)}</div></details><details><summary><span class="summary-title">Detailed chapter breakdown</span><span class="chapter-count">${v.chapters.length} chapters</span></summary><div class="chapters">${v.chapters.map(c=>`<a class="chapter" href="${esc(chapterUrl(v.url,c.start_seconds))}" target="_blank" rel="noopener" aria-label="Watch ${esc(c.title)} at ${esc(c.timestamp||fmtDuration(c.start_seconds))}"><span class="time">${esc(c.timestamp||fmtDuration(c.start_seconds))}</span><span><span class="chapter-title">${esc(c.title)}</span><span class="badge ${c.source==='creator'?'creator':''}">${c.source==='creator'?'Creator chapter':'AI-selected moment'}</span><div class="chapter-desc">${esc(c.description)}</div></span><span class="chapter-action">Jump to video <span>↗</span></span></a>`).join('')}</div></details></article>`).join(''):`<div class="empty">${activeView==='archive'?'No archived summaries yet.':'No unread summaries match this search.'}</div>`}
    fetch('./videos.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{DATA=d;render()}).catch(e=>{$('#cards').innerHTML=`<div class="error">Could not load the library: ${esc(e.message)}</div>`});
    $('#search').addEventListener('input',render);$('#chapterFilter').addEventListener('change',render);document.querySelector('.archive-tabs').addEventListener('click',e=>{const tab=e.target.closest('[data-view]');if(!tab)return;activeView=tab.dataset.view;document.querySelectorAll('.archive-tab').forEach(x=>{const selected=x===tab;x.classList.toggle('active',selected);x.setAttribute('aria-selected',selected)});render()});$('#cards').addEventListener('change',e=>{const box=e.target.closest('.archive-toggle');if(!box)return;box.checked?archived.add(box.dataset.videoId):archived.delete(box.dataset.videoId);saveArchive();render()});
  </script>
</body>
</html>
